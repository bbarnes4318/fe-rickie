<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scripting Tool | AmerBen</title>
    <meta
      name="description"
      content="Final Expense Sales Scripting Tool with integrated quoting engine"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Prevent any flash of unstyled content */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #f8fafc;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      #wizard-root {
        height: 100vh;
        height: 100dvh;
      }
      /* Loading state */
      .wizard-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
      }
      .wizard-loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .wizard-loading-text {
        font-size: 14px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="wizard-root">
      <div class="wizard-loading">
        <div class="wizard-loading-spinner"></div>
        <div class="wizard-loading-text">Loading Scripting Tool...</div>
      </div>
    </div>
    <script type="module" src="/src/wizardMain.jsx"></script>
  </body>
</html>
